services:
  chaos-workshop-ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      workshop-controller:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - workshop-net

  workshop-controller:
    build:
      context: .
      dockerfile: workshop-controller/Dockerfile
    environment:
      CHALLENGE_DIRECTORY: /app/challenges
      STOREFRONT_BASE_URL: http://storefront-service:8080
      TOXIPROXY_API_URL: http://toxiproxy:8474
      GAMEDAY_SCENARIO: ${GAMEDAY_SCENARIO:-inventory-latency}
    depends_on:
      storefront-service:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    restart: on-failure
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - workshop-net

  storefront-service:
    build:
      context: .
      dockerfile: services/storefront-service/Dockerfile
    environment:
      INVENTORY_BASE_URL: http://toxiproxy:8666
      SHIPPING_BASE_URL: http://toxiproxy:8667
      EXPERIMENT_INVENTORY_BASE_URL: http://toxiproxy:8668
      GAMEDAY_INVENTORY_BASE_URL: http://toxiproxy:8669
      GAMEDAY_SHIPPING_BASE_URL: http://toxiproxy:8670
    depends_on:
      inventory-service:
        condition: service_healthy
      shipping-service:
        condition: service_healthy
      toxiproxy:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - workshop-net

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - workshop-net

  shipping-service:
    build:
      context: .
      dockerfile: services/shipping-service/Dockerfile
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - workshop-net

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    expose:
      - "8474"
      - "8666"
      - "8667"
      - "8668"
      - "8669"
      - "8670"
    networks:
      - workshop-net

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - workshop-net

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - workshop-net

networks:
  workshop-net:
    driver: bridge
