global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: workshop-controller
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["workshop-controller:8080"]
  - job_name: storefront-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["storefront-service:8080"]
